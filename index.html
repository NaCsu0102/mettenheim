<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хроники Меттенхейма</title>
<meta name="description" content="Ролевой проект на Conan Exiles. Город пара, стали и амбиций.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="style.css?v=4">
<link rel="icon" href="assets/logo.webp">
</head>
<body>
<div class="machinery" aria-hidden="true">
  <img class="l1" data-speed=".12" src="assets/scroll-gear.webp" alt="">
  <img class="l2" data-speed="-.2" src="assets/scroll-gear.webp" alt="">
  <img class="r1" data-speed="-.1" src="assets/scroll-gear.webp" alt="">
  <img class="r2" data-speed=".18" src="assets/scroll-gear.webp" alt="">
</div>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="На главную">
      <img src="assets/logo.webp" alt="">
      <span>Хроники Меттенхейма<small>RP 21+ · Conan Exiles</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Разделы сайта"></nav>
    <div class="tools">
      <div class="house-gears" role="group" aria-label="Цвет Дома">
        <button class="house-gear" data-h="talbot" aria-pressed="true" title="Жёлтые — Дом Талбот" aria-label="Тема Дома Талбот"><i aria-hidden="true"></i><b aria-hidden="true">Т</b></button>
        <button class="house-gear" data-h="dorn" aria-pressed="false" title="Красные — Дом Дорн" aria-label="Тема Дома Дорн"><i aria-hidden="true"></i><b aria-hidden="true">Д</b></button>
      </div>
      <a class="icon-btn cab-btn" id="cabBtn" href="#cabinet" aria-label="Личный кабинет" title="Личный кабинет"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Кабинет</span></a>
      <button class="icon-btn" id="soundBtn" aria-pressed="false" aria-label="Музыка и звук" title="Музыка и звук"></button>
      <button class="icon-btn burger" id="burger" aria-expanded="false" aria-controls="nav" aria-label="Меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="footer">
  <div class="wrap">
    <img src="assets/logo.webp" alt="">
    <span>ХРОНИКИ МЕТТЕНХЕЙМА · ПАР · СТАЛЬ · ЛЮМЕРИТ</span>
    <span>RP 21+</span>
  </div>
</footer>

<div class="shift" id="shift" aria-hidden="true"><img src="assets/scroll-gear.webp" alt=""></div>

<div class="welcome" id="welcome" hidden>
  <div class="welcome-card" role="dialog" aria-modal="true" aria-labelledby="wTitle">
    <img src="assets/scroll-gear.webp" alt="">
    <div class="eyebrow">Хроники Меттенхейма</div>
    <h2 id="wTitle">Город звучит</h2>
    <p>Включить музыку и звуки механизмов? Их можно выключить кнопкой в шапке.</p>
    <div class="row">
      <button class="btn" id="wOn">Включить музыку</button>
      <button class="btn ghost" id="wOff">Без звука</button>
    </div>
  </div>
</div>

<script src="data.js?v=4"></script>
<script src="rules-data.js?v=4"></script>
<script src="items-art.js?v=4"></script>
<script src="icons-art.js?v=4"></script>
<script src="tools.js?v=4"></script>
<script src="infernal.js?v=4"></script>
<script src="config.js?v=4"></script>
<script src="cabinet.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
